name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy opencv-python-headless pytest
      - run: pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # 릴리스 생성
    steps:
      - uses: actions/checkout@v4

      - name: Build credential provider DLL
        run: |
          cmake -S provider -B build -A x64
          cmake --build build --config Release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build verifier exe
        run: |
          pip install numpy opencv-python pyinstaller
          pyinstaller --noconfirm --onedir --console --name faceunlock verifier/faceunlock.py

      - name: Download face models
        shell: pwsh
        run: |
          $m = "dist/faceunlock/models"
          New-Item -ItemType Directory $m -Force | Out-Null
          Invoke-WebRequest https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx -OutFile "$m/face_detection_yunet_2023mar.onnx"
          Invoke-WebRequest https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx -OutFile "$m/face_recognition_sface_2021dec.onnx"
          # installer/FaceUnlock.psm1 의 $script:Models 해시와 같아야 한다
          $want = @{
            'face_detection_yunet_2023mar.onnx'   = '8F2383E4DD3CFBB4553EA8718107FC0423210DC964F9F4280604804ED2552FA4'
            'face_recognition_sface_2021dec.onnx' = '0BA9FBFA01B5270C96627C4EF784DA859931E02F04419C829E83484087C34E79'
          }
          foreach ($k in $want.Keys) {
            $h = (Get-FileHash "$m/$k" -Algorithm SHA256).Hash
            if ($h -ne $want[$k]) { throw "model hash mismatch: $k ($h)" }
          }

      - name: Smoke test verifier (no camera -> must exit cleanly)
        shell: pwsh
        run: |
          $env:FACEUNLOCK_DATA = "$env:RUNNER_TEMP\fu"
          & dist/faceunlock/faceunlock.exe verify
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 (not enrolled), got $LASTEXITCODE" }
          Write-Host "verifier smoke test ok (exit 2 = not enrolled)"
          exit 0

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem installer, hello -Recurse -Include *.ps1, *.psm1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { throw "$bad file(s) with syntax errors" }

      - name: Package
        shell: pwsh
        run: |
          $out = "package/FaceUnlock"
          New-Item -ItemType Directory "$out/verifier" -Force | Out-Null
          Copy-Item build/Release/FaceUnlockProvider.dll $out
          Copy-Item dist/faceunlock/* "$out/verifier" -Recurse
          Copy-Item installer "$out/installer" -Recurse
          Copy-Item README.md, LICENSE $out
          Compress-Archive -Path $out -DestinationPath FaceUnlock.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FaceUnlock
          path: package/FaceUnlock

      # main 에 push 할 때마다 릴리스를 만든다 -> setup.ps1 이 releases/latest 에서 받는다.
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: FaceUnlock.zip
